<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d6b65"/>
      <stop offset="100%" stop-color="#0c5f8f"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="136" y1="120" x2="376" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2f1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="100" ry="100" fill="url(#bg)"/>

  <!-- Subtle top-left highlight -->
  <ellipse cx="160" cy="160" rx="200" ry="200" fill="white" opacity="0.04"/>

  <!-- Graduation cap -->
  <g transform="translate(256, 175)">
    <!-- Cap board (diamond shape) -->
    <polygon points="0,-60 130,0 0,32 -130,0" fill="url(#capGrad)" opacity="0.95"/>
    <!-- Cap button top -->
    <circle cx="0" cy="-60" r="11" fill="white"/>
    <!-- Tassel string -->
    <path d="M0,-60 Q40,-40 75,-15 Q85,-10 85,8" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Tassel bob -->
    <ellipse cx="85" cy="18" rx="7" ry="9" fill="white" opacity="0.6"/>
  </g>

  <!-- Pulse / heartbeat line -->
  <polyline
    points="72,320 160,320 195,320 218,270 248,380 278,240 305,360 325,290 345,320 380,320 440,320"
    stroke="white"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.92"
  />

  <!-- Endpoint dots -->
  <circle cx="72" cy="320" r="5.5" fill="white" opacity="0.45"/>
  <circle cx="440" cy="320" r="5.5" fill="white" opacity="0.45"/>

  <!-- Faint ring accent bottom-right -->
  <circle cx="400" cy="420" r="60" stroke="white" stroke-width="1.5" fill="none" opacity="0.06"/>
  <circle cx="400" cy="420" r="40" stroke="white" stroke-width="1" fill="none" opacity="0.04"/>
</svg>
