name: Reliability Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: classpulse-reliability-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Process due ClassPulse maintenance jobs
        env:
          FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          CRON_SECRET: ${{ secrets.RELIABILITY_CRON_SECRET }}
        run: |
          test -n "$FUNCTIONS_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 120 \
            -X POST "$FUNCTIONS_URL/reliability-worker" \
            -H "content-type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            --data '{}'
